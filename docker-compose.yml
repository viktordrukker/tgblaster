# One service, no ports, no database server: state lives in ./data
# (SQLite) and ./sessions (Telethon session) on the host.
#
#   docker compose build
#   docker compose run --rm blaster inspect data/inbox/contacts.xlsx
#   docker compose run --rm blaster login                    # interactive, once
#   docker compose run -d --name tgb-send blaster send NAME --until-done --yes
#   docker logs -f tgb-send        # watch
#   docker stop -t 90 tgb-send     # graceful stop; re-run the same command to resume
services:
  blaster:
    build: .
    image: tgblaster:2
    env_file: .env
    environment:
      BLASTER_HOME: /app
    volumes:
      - ./sessions:/app/sessions
      - ./data:/app/data
      - ./campaigns:/app/campaigns
    stdin_open: true
    tty: true
    stop_signal: SIGINT
    stop_grace_period: 90s
